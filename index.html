<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico — Jp Nogueira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EDEDED; --card:#FFFFFF; --ink:#000000; --ink-2:#3A3A3A; --muted:#7A7A7A; --line:#DCDCDC; --soft:#F5F5F5; --on-ink:#FFFFFF;
  --font:"Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#000000; --card:#141414; --ink:#FFFFFF; --ink-2:#C8C8C8; --muted:#8A8A8A; --line:#2A2A2A; --soft:#1C1C1C; --on-ink:#000000; }
}
:root[data-theme="dark"]{ --page:#000000; --card:#141414; --ink:#FFFFFF; --ink-2:#C8C8C8; --muted:#8A8A8A; --line:#2A2A2A; --soft:#1C1C1C; --on-ink:#000000; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--page); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

.wrap{max-width:600px; margin:0 auto; padding:28px 20px 56px; min-height:100vh; display:flex; flex-direction:column}
header{display:flex; align-items:center; justify-content:space-between; gap:16px}
.brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:.95rem; letter-spacing:-.01em}
.brand i{width:22px; height:22px; border-radius:5px; background:var(--ink); display:grid; place-items:center; color:var(--on-ink); font-style:normal; font-size:.7rem; font-weight:600}
.count{color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums}
.segs{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:20px; height:3px}
.segs span{background:var(--line); border-radius:2px; overflow:hidden; position:relative}
.segs span::after{content:""; position:absolute; inset:0; background:var(--ink); transform:scaleX(0); transform-origin:left; transition:transform .4s ease}
.segs span.on::after{transform:scaleX(1)}

.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:clamp(24px,5vw,40px); margin-top:24px}
.card.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

.tag{display:inline-block; font-size:.8rem; font-weight:500; color:var(--ink-2); background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:4px 12px; margin-bottom:18px}
h1,h2{font-weight:600; letter-spacing:-.025em; margin:0}
h1{font-size:clamp(2rem,6vw,2.75rem); line-height:1.05}
h2{font-size:clamp(1.5rem,4.5vw,1.9rem); line-height:1.15}
.sub{color:var(--ink-2); font-size:1.1rem; line-height:1.45; margin:14px 0 0; max-width:46ch}
.intro-h{font-size:clamp(1.7rem,5.4vw,2.4rem); line-height:1.1}

/* Antes / Hoje — sequência de abertura */
.story{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:26px; position:relative}
.ph{position:relative; margin:0; border-radius:12px; overflow:hidden; aspect-ratio:4/5; background:var(--soft); opacity:0; transform:translateY(14px)}
.ph img{width:100%; height:100%; object-fit:cover; display:block}
.ph figcaption{position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.72); color:#fff; font-size:.78rem; font-weight:500; padding:5px 11px; border-radius:999px; backdrop-filter:blur(6px)}
.ph.antes img{filter:grayscale(1) contrast(1.05) brightness(.9)}
.ph.hoje img{filter:grayscale(1); transform:scale(1.08); transition:filter 1.4s ease, transform 2.4s cubic-bezier(.2,.7,.2,1)}
.play .ph.antes{animation:rise .7s .15s cubic-bezier(.2,.7,.2,1) forwards}
.play .ph.hoje{animation:rise .7s .75s cubic-bezier(.2,.7,.2,1) forwards}
.play.color .ph.hoje img{filter:none; transform:scale(1)}
@keyframes rise{to{opacity:1; transform:none}}
.result{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:22px; padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:var(--soft); width:fit-content; margin-left:auto; margin-right:auto; opacity:0; transform:translateY(8px)}
.play .result{animation:rise .6s .45s ease forwards}
.result small{font-size:.95rem; color:var(--ink-2)}
.result b{font-size:.95rem; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink)}
.result i{width:1px; height:14px; background:var(--line)}
.hl{opacity:0; transform:translateY(8px)}
.play .hl{animation:rise .6s ease forwards}
.play .hl.d2{animation-delay:.1s}
.cta-in{opacity:0}
.play .cta-in{animation:rise .5s .2s ease forwards}
@media (prefers-reduced-motion: reduce){ .ph,.result,.hl,.cta-in{opacity:1!important; transform:none!important} .ph.hoje img{filter:none; transform:none} }

/* Antes / Hoje */
.compare{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:28px}
.compare div{border:1px solid var(--line); border-radius:10px; padding:16px; background:var(--soft)}
.compare div:last-child{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.compare small{display:block; font-size:.78rem; opacity:.65}
.compare strong{display:block; font-size:1.05rem; font-weight:500; margin-top:6px; letter-spacing:-.01em}

/* Ilustrações por etapa */
.visual{margin-top:22px}
.notif{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--soft); max-width:340px}
.notif .ic{width:34px; height:34px; border-radius:8px; background:var(--ink); color:var(--on-ink); display:grid; place-items:center; flex:none}
.notif b{display:block; font-weight:600; font-size:.9rem}
.notif span{font-size:.85rem; color:var(--muted)}
.notif em{margin-left:auto; font-style:normal; font-size:.78rem; color:var(--muted); align-self:flex-start}
.flow{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:center; gap:8px}
.flow div{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--soft); text-align:center}
.flow b{display:block; font-size:.85rem; font-weight:600}
.flow span{font-size:.75rem; color:var(--muted)}
.flow svg{color:var(--muted)}
.chips{display:flex; gap:8px}
.chips span{border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.85rem; font-weight:500; background:var(--soft)}
.note{font-size:.88rem; color:var(--muted); border-left:2px solid var(--ink); padding-left:12px}

.options{display:flex; flex-direction:column; gap:8px; margin-top:26px}
.opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:15px 16px; cursor:pointer; font-weight:500; transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--ink-2)}
.opt .k{width:24px; height:24px; border-radius:6px; border:1px solid var(--line); display:grid; place-items:center; font-size:.72rem; color:var(--muted); flex:none; transition:all .15s}
.opt .ck{margin-left:auto; opacity:0; transition:opacity .15s}
.opt[aria-checked="true"]{border-color:var(--ink); background:var(--soft)}
.opt[aria-checked="true"] .k{background:var(--ink); border-color:var(--ink); color:var(--on-ink)}
.opt[aria-checked="true"] .ck{opacity:1}

.foot{display:flex; align-items:center; justify-content:space-between; margin-top:22px; min-height:24px}
.back{background:none; border:0; padding:4px 0; color:var(--muted); cursor:pointer; font-size:.88rem}
.back:hover{color:var(--ink)}
.kbd{color:var(--muted); font-size:.8rem}
.kbd kbd{font-family:var(--font); border:1px solid var(--line); border-radius:4px; padding:0 6px; font-size:.75rem; background:var(--soft)}

.btn{display:flex; width:100%; align-items:center; justify-content:center; gap:10px; background:var(--ink); color:var(--on-ink); border:0; border-radius:10px; padding:16px 22px; font-weight:500; font-size:1rem; cursor:pointer; text-decoration:none; margin-top:28px; transition:opacity .15s}
.btn:hover{opacity:.86}
.btn[disabled]{opacity:.35; cursor:not-allowed}
.meta{display:flex; justify-content:center; flex-wrap:wrap; gap:6px 18px; margin-top:14px; font-size:.95rem; color:var(--ink-2)}

/* Analisando */
.pct{font-size:3.5rem; font-weight:600; letter-spacing:-.04em; font-variant-numeric:tabular-nums; line-height:1}
.track{height:4px; background:var(--line); border-radius:4px; margin:22px 0 6px; overflow:hidden}
.track i{display:block; height:100%; width:0; background:var(--ink)}
.summary{margin:22px 0 0; padding:0; border-top:1px solid var(--line)}
.summary div{display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid var(--line); font-size:.9rem; opacity:.3; transition:opacity .3s}
.summary div.on{opacity:1}
.summary dt{color:var(--muted)}
.summary dd{margin:0; font-weight:500; text-align:right}

/* Captura */
.field{margin-top:18px}
.field label{display:block; font-size:.88rem; font-weight:500; margin-bottom:7px}
.input{width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 15px; font-size:1rem; transition:border-color .15s}
.input:focus{outline:none; border-color:var(--ink)}
.input[aria-invalid="true"]{border-color:var(--ink); box-shadow:0 0 0 3px var(--line)}
.err{font-size:.82rem; color:var(--ink-2); margin-top:6px; min-height:1.1em}
.secure{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; font-size:.8rem; color:var(--muted)}

/* Vídeo do resultado */
.vid{position:relative; margin-top:22px; border-radius:12px; overflow:hidden; background:#000; aspect-ratio:16/9}
.vid .frame{position:absolute; left:0; right:0; top:-70px; bottom:-70px}
.vid .frame iframe,.vid .frame>div{width:100%; height:100%; border:0; display:block}
.vid .shield{position:absolute; inset:0; cursor:pointer; display:none}
.vid.live .shield{display:block}
.vid.live .frame{pointer-events:none}
.vid .cover.start{pointer-events:none}
.vid .cover{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(0,0,0,.78); color:#fff; font-size:.9rem; font-weight:500; transition:opacity .25s}
.vid .cover.start,.vid .cover.ended{background:#000}
.vid .cover.hide{opacity:0; pointer-events:none}
.play-btn{width:64px; height:64px; border-radius:50%; background:#fff; color:#000; border:0; display:grid; place-items:center; cursor:pointer; transition:transform .15s}
.play-btn:hover{transform:scale(1.05)}
.vbar{height:3px; background:var(--line); border-radius:3px; margin-top:12px; overflow:hidden}
.vbar i{display:block; height:100%; width:0; background:var(--ink); transition:width .5s linear}
.vmeta{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums}

footer{margin-top:auto; padding-top:28px; text-align:center; font-size:.78rem; color:var(--muted)}

@media (max-width:480px){
  .flow{grid-template-columns:1fr; gap:6px}
  .flow svg{transform:rotate(90deg); justify-self:center}
  .kbd{display:none}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

    options:["Uma renda extra todo mês","Ter um negócio meu","Sair do meu emprego","Complementar a aposentadoria"] },
  { id:"trava", tag:"Trava", q:"O que mais te atrapalhou até hoje?", visual:FLOW,
    options:["Não sei por onde começar","Não tenho de quem comprar os produtos","Não tenho dinheiro pra comprar estoque","Tenho medo de perder dinheiro","Já anunciei e não vendeu"] },
  { id:"tempo", tag:"Tempo", q:"Quanto tempo livre você tem por dia?", visual:`<p class="note">Poucas horas por dia, bem usadas.</p>`,
    options:["Menos de 1 hora","De 1 a 2 horas","3 horas ou mais"] },
  { id:"comeco", tag:"Começo", q:"Quanto você consegue separar hoje pra começar?", sub:"É para o sistema e os primeiros pedidos. Você não precisa comprar estoque.",
    options:["Até R$ 300","De R$ 300 a R$ 1.000","Mais de R$ 1.000","Nada no momento"] },
  { id:"setup", tag:"Setup", q:"Você usa computador ou só o celular?", visual:FLOW,
    options:["Uso computador ou notebook","Tenho computador, mas quase não uso","Só uso o celular"] }
];
/* ================================ */

const $ = s => document.querySelector(s);
const view = $("#view");
const total = QUESTIONS.length;
const state = { i:-1, a:{} };
const utm = Object.fromEntries([...new URLSearchParams(location.search)].filter(([k]) => k.startsWith("utm_")));
// Contador por origem (18/11): registra só o ref e a etapa, sem dado pessoal
const REF = String(utm.utm_content || "").toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,20) || "sem-ref";
function vaEvent(name){ try{ window.va("event", { name: name, data: { ref: REF } }); }catch(e){} }
vaEvent("1 Abriu o diagnostico");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function progress(){
  const n = state.i < 0 ? 0 : Math.min(state.i, total);
  document.querySelectorAll("#segs span").forEach((s,k) => s.classList.toggle("on", k < n));
  $("#count").textContent = state.i >= 0 && state.i < total ? `${state.i+1} de ${total}` : "";
}
function swap(html){
  view.classList.remove("enter","play","color"); void view.offsetWidth;
  view.innerHTML = html; view.classList.add("enter"); progress();
  window.scrollTo({top:0});
}

function intro(){
  state.i = -1;
  swap(`
    <span class="tag hl">Diagnóstico gratuito</span>
    <h1 class="hl intro-h">Descubra em 1 minuto o que falta pra você vender na Shopee e no Mercado Livre sem comprar estoque</h1>
    <p class="sub hl d2">São 6 perguntas rápidas. No final você recebe a aula gratuita no WhatsApp.</p>
    <div class="cta-in">
      <button class="btn" id="start">Começar o diagnóstico ${ARROW}</button>
      <div class="meta"><span>6 perguntas</span><span>Menos de 1 minuto</span><span>Gratuito</span></div>
    </div>
    <div class="result"><b>+ de 1.400 pedidos</b><i></i><small>feitos numa loja minha</small></div>`);
  requestAnimationFrame(() => view.classList.add("play"));
  $("#start").onclick = () => go(0);
}

let introPlayed = false;
function playIntro(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const money = $("#money"), target = 500000;
  const fmt = v => v >= target ? "R$ 500 mil+" : "R$ " + Math.round(v/1000) + " mil";
  if(reduce || introPlayed){ view.classList.add("play","color"); money.textContent = fmt(target); return; }
  introPlayed = true;
  requestAnimationFrame(() => view.classList.add("play"));
  setTimeout(() => view.classList.add("color"), 1300);
  setTimeout(() => {
    const t0 = performance.now(), dur = 1600;
    (function tick(now){
      const p = Math.min(1,(now-t0)/dur), e = 1 - Math.pow(1-p,3);
      money.textContent = p < 1 ? fmt(e*target) : fmt(target);
      if(p < 1) requestAnimationFrame(tick);
    })(t0);
  }, 1650);
}

function question(){
  const Q = QUESTIONS[state.i], cur = state.a[Q.id];
  swap(`
    <span class="tag">${Q.tag}</span>
    <h2 id="qt">${esc(Q.q)}</h2>
    ${Q.sub ? `<p class="sub">${Q.sub}</p>` : ""}
    ${Q.visual ? `<div class="visual">${Q.visual}</div>` : ""}
    <div class="options" role="radiogroup" aria-labelledby="qt">
      ${Q.options.map((o,k) => `<button class="opt" role="radio" aria-checked="${cur===o}" data-v="${esc(o)}"><span class="k">${String.fromCharCode(65+k)}</span>${esc(o)}<svg class="ck" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.3l3 3 6-6.3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>`).join("")}
    </div>
    <div class="foot">
      <button class="back" id="back">← Voltar</button>
      <span class="kbd">Use <kbd>A</kbd>–<kbd>${String.fromCharCode(64+Q.options.length)}</kbd></span>
    </div>`);
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(b.dataset.v));
  $("#back").onclick = () => state.i > 0 ? go(state.i-1) : intro();
}

let lock = false;
function choose(v){
  if(lock) return;
  state.a[QUESTIONS[state.i].id] = v;
  view.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-checked", b.dataset.v === v));
  lock = true;
  setTimeout(() => { lock = false; go(state.i+1); }, 280);
}
function go(i){ state.i = i; i < total ? question() : analyzing(); }

function analyzing(){
  state.i = total;
  try{ (vaEvent("2 Concluiu as perguntas"), fbq("trackCustom","DiagnosticoConcluido")); }catch(e){}
  swap(`
    <span class="tag">Analisando</span>
    <div class="pct" id="pct">0%</div>
    <div class="track"><i id="trk"></i></div>
    <h2 style="margin-top:22px">Montando seu plano</h2>
    <p class="sub">Cruzando o que você respondeu com o que funciona hoje no marketplace.</p>
    <dl class="summary">${QUESTIONS.map(q => `<div><dt>${q.tag}</dt><dd>${esc(state.a[q.id])}</dd></div>`).join("")}</dl>`);
  const rows = view.querySelectorAll(".summary div");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduce ? 600 : 3600, t0 = performance.now();
  (function tick(now){
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1-p, 2), v = Math.round(e*100);
    $("#pct").textContent = v + "%"; $("#trk").style.width = v + "%";
    rows.forEach((r,k) => r.classList.toggle("on", e >= (k+1)/(rows.length+1)));
    p < 1 ? requestAnimationFrame(tick) : setTimeout(goWhats, 350);
  })(t0);
}

const VIDEO_ID = "Bo6cJlJ68Po";
const WA_MSG = "Opa Nogueira, respondi o formulário e quero ganhar dinheiro com Shopee e Mercado Livre";
const WA_URL = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(WA_MSG)}`;
function loadYT(cb){
  if(window.YT && YT.Player) return cb();
  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => { prev && prev(); cb(); };
  if(!document.getElementById("yt-api")){
    const s = document.createElement("script"); s.id = "yt-api"; s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  }
}
const fmtT = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const PLAY_ICON = `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M7 4.5v13l11-6.5z" fill="currentColor"/></svg>`;

function resultVideo(){
  swap(`
    <span class="tag">Seu resultado</span>
    <h2>Assista ao seu resultado</h2>
    <p class="sub">O botão para receber o minicurso é liberado quando o vídeo terminar.</p>
    <div class="vid" id="vid">
      <div class="frame"><div id="yt"></div></div>
      <div class="shield" id="shield"></div>
      <div class="cover start" id="cover"><button class="play-btn" id="play" aria-label="Assistir">${PLAY_ICON}</button><span id="ctext">Carregando vídeo…</span></div>
    </div>
    <div class="vbar"><i id="vprog"></i></div>
    <div class="vmeta"><span id="vtime">0:00</span><span id="vdur"></span></div>
    <button class="btn" id="unlock" disabled>Disponível ao final do vídeo</button>`);

  const cover = $("#cover"), ctext = $("#ctext"), shield = $("#shield"), btn = $("#unlock");
  let player, maxT = 0, timer, unlocked = false, started = false;

  const unlock = () => {
    if(unlocked) return; unlocked = true;
    btn.disabled = false; btn.innerHTML = `Receber o minicurso ${ARROW}`;
    btn.onclick = () => { try{ player && player.pauseVideo(); }catch(e){} location.href = WA_URL; };
  };
  const setCover = (cls, text) => { cover.className = "cover " + cls; ctext.textContent = text; };

  const tick = () => {
    if(!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime(), d = player.getDuration() || 0;
    if(t > maxT + 1.5){ player.seekTo(maxT, true); return; }   // impede pular
    maxT = Math.max(maxT, t);
    if(d){ $("#vprog").style.width = (maxT/d*100) + "%"; $("#vdur").textContent = fmtT(d); }
    $("#vtime").textContent = fmtT(t);
  };

  let wantPlay = false;
  const play = () => {
    if(!player || !player.playVideo){ wantPlay = true; return; }
    player.playVideo();
  };
  $("#play").onclick = play;
  shield.onclick = () => { if(player && player.getPlayerState() === 1) player.pauseVideo(); };

  const failSafe = setTimeout(() => { if(!player || !player.getPlayerState) unlock(); }, 10000);

  loadYT(() => {
    player = new YT.Player("yt", {
      host: "https://www.youtube-nocookie.com",
      videoId: VIDEO_ID,
      playerVars: { controls:0, disablekb:1, modestbranding:1, rel:0, playsinline:1, iv_load_policy:3, fs:0, cc_load_policy:0, origin:location.origin },
      events: {
        onReady: () => { clearTimeout(failSafe); timer = setInterval(tick, 400); if(!started) ctext.textContent = "Toque para assistir"; if(wantPlay) play(); },
        onStateChange: e => {
          if(e.data === 1){ started = true; $("#vid").classList.add("live"); cover.classList.add("hide"); }
          if(e.data === 2) setCover("paused", "Continuar assistindo");
          if(e.data === 0){
            const d = player.getDuration() || 0;
            if(maxT >= d - 3){ setCover("ended", "Vídeo concluído"); $("#play").style.display = "none"; $("#vprog").style.width = "100%"; unlock(); }
            else { player.seekTo(maxT, true); }
          }
        },
        onError: () => { clearTimeout(failSafe); unlock(); }
      }
    });
  });
}

function maskPhone(v){
  const d = v.replace(/\D/g,"").slice(0,11);
  if(d.length <= 2) return d ? `(${d}` : "";
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}

function capture(){
  swap(`
    <span class="tag">Quase lá</span>
    <h2>Para onde envio o minicurso?</h2>
    <p class="sub">Informe seus dados para receber o minicurso no WhatsApp.</p>
    <div class="field"><label for="nome">Nome</label><input class="input" id="nome" autocomplete="name" placeholder="Seu nome completo"><div class="err" id="e-nome"></div></div>
    <div class="field"><label for="whats">WhatsApp</label><input class="input" id="whats" inputmode="tel" autocomplete="tel-national" placeholder="(11) 99999-9999"><div class="err" id="e-whats"></div></div>
    <button class="btn" id="send">Receber o minicurso ${ARROW}</button>
    <div class="secure"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="5" width="8" height="6" rx="1.2" fill="none" stroke="currentColor"/><path d="M4 5V3.6a2 2 0 014 0V5" fill="none" stroke="currentColor"/></svg>Seus dados não são compartilhados.</div>`);
  const n = $("#nome"), w = $("#whats");
  w.oninput = () => { w.value = maskPhone(w.value); w.removeAttribute("aria-invalid"); $("#e-whats").textContent=""; };
  n.oninput = () => { n.removeAttribute("aria-invalid"); $("#e-nome").textContent=""; };
  [n,w].forEach(el => el.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submit(); } }));
  $("#send").onclick = submit;
  n.focus({preventScroll:true});
}

// Teste 17/11: depois das perguntas, vai direto pro WhatsApp (sem vídeo e sem formulário)
function goWhats(){
  const msg = "Opa Nogueira, respondi o formulário e quero ganhar dinheiro com Shopee e Mercado Livre\n\nMeu diagnóstico: " + QUESTIONS.map(q => q.tag + ": " + state.a[q.id]).join(" | ");
  const ref = String(utm.utm_content || "").toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,20);
  const url = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg + (ref ? "\n\nref: " + ref : ""))}`;
  swap(`
    <span class="tag">Diagnóstico pronto</span>
    <h2>Seu diagnóstico está pronto. Toque no botão para receber a aula gratuita no WhatsApp.</h2>
    <p class="sub">A conversa já abre com a mensagem pronta. É só enviar.</p>
    <a class="btn" id="gowa" href="${url}" target="_blank" rel="noopener">Receber a aula no WhatsApp ${ARROW}</a>`);
  let sent = false;
  $("#gowa").addEventListener("click", () => { if(sent) return; sent = true; vaEvent("3 Clicou no WhatsApp"); try{ fbq("track","Lead"); }catch(e){} });
}

function submit(){
  const n = $("#nome"), w = $("#whats");
  const nome = n.value.trim(), digits = w.value.replace(/\D/g,"");
  let ok = true;
  if(nome.length < 2){ n.setAttribute("aria-invalid","true"); $("#e-nome").textContent = "Informe seu nome."; ok = false; }
  if(digits.length < 10){ w.setAttribute("aria-invalid","true"); $("#e-whats").textContent = "Informe o WhatsApp com DDD."; ok = false; }
  if(!ok){ view.querySelector('[aria-invalid="true"]').focus(); return; }

  try{ fbq("track","Lead"); }catch(e){}
  const payload = { nome, whatsapp:w.value, ...state.a, utm, enviadoEm:new Date().toISOString() };
  if(CONFIG.webhookUrl){ try{ fetch(CONFIG.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,body:JSON.stringify(payload)}).catch(()=>{}); }catch(e){} }

  const msg = "Opa Nogueira, respondi o formulário e quero ganhar dinheiro com Shopee e Mercado Livre\n\nMeu diagnóstico: " + QUESTIONS.map(q => q.tag + ": " + state.a[q.id]).join(" | ");
  const url = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  swap(`
    <span class="tag">Último passo</span>
    <h2>${esc(nome.split(" ")[0])}, toque no botão para receber o minicurso.</h2>
    <p class="sub">Sua conversa no WhatsApp já vai aberta com a mensagem pronta. É só enviar.</p>
    <a class="btn" href="${url}" target="_blank" rel="noopener">Abrir WhatsApp ${ARROW}</a>`);
}

document.addEventListener("keydown", e => {
  const Q = QUESTIONS[state.i];
  if(!Q || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  const k = e.key.toUpperCase().charCodeAt(0) - 65;
  if(k >= 0 && k < Q.options.length){ e.preventDefault(); choose(Q.options[k]); }
});

intro();
setTimeout(() => loadYT(() => {}), 800);   // pré-carrega o player do vídeo
</script>
